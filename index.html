<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>កាលវិភាគគ្រូពេទ្យ (SOPHEAK VISAL CLINIC)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f9;
    --card:#ffffff;
    --ink:#1c2430;
    --sub:#6b7686;
    --line:#e6e9ef;
    --brand:#2f6fed;
    --brand-ink:#ffffff;
    --spv:#2f6fed;
    --spv-bg:#eaf1ff;
    --off:#e05252;
    --off-bg:#fdeaea;
    --warn:#d97706;
    --warn-bg:#fef3e0;
    --radius:14px;
    --shadow:0 1px 2px rgba(20,25,40,.04), 0 8px 24px rgba(20,25,40,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans Khmer','Inter',sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    font-size:14px;
  }
  #app{max-width:1180px;margin:0 auto;padding:18px 16px 60px;}

  header.top{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
    margin-bottom:16px;
  }
  header.top h1{font-size:19px;font-weight:700;margin:0;}
  header.top .muted{color:var(--sub);font-size:12.5px;margin-top:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .refresh-link{color:var(--brand);cursor:pointer;font-weight:600;text-decoration:underline;}

  .tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:12px;box-shadow:var(--shadow);}
  .tab{
    padding:8px 16px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--sub);
    font-size:13.5px; user-select:none; white-space:nowrap;
  }
  .tab.active{background:var(--brand);color:var(--brand-ink);}
  .tab.admin-tab.on{background:#e8f5e9;color:#2e7d32;}

  .panel{display:none;}
  .panel.active{display:block;}

  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px;}

  .month-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;justify-content:space-between;}
  .month-nav .left{display:flex;align-items:center;gap:8px;}
  .month-nav button.nav-btn{
    border:1px solid var(--line);background:#fff;border-radius:9px;width:34px;height:34px;
    cursor:pointer;font-size:16px;color:var(--ink);
  }
  .month-nav button.nav-btn:hover{background:#f0f2f6;}
  .month-nav .month-label{font-weight:700;font-size:16px;min-width:150px;text-align:center;}
  .month-nav .today-btn{
    border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--sub);
  }
  .complete-btn.is-incomplete{border-color:var(--line);background:#fff;color:var(--sub);}
  .complete-btn.is-complete{border-color:#2e7d32;background:#e8f5e9;color:#2e7d32;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

  table.sched{width:100%;border-collapse:collapse;font-size:12.8px;}
  table.sched thead th{
    background:#f7f8fb;color:var(--sub);font-weight:600;text-align:center;
    padding:9px 4px;border-bottom:1px solid var(--line);position:sticky;top:0;
    white-space:nowrap;
  }
  table.sched thead th.group-spv{color:var(--spv);}
  table.sched th.grp-start, table.sched td.grp-start{border-left:10px solid #dfe8f6;box-shadow:inset 1px 0 0 #8fa3c4;}
  /* ស៊ុមតារាងឲ្យស្អាត */
  #scheduleWrap > div{border:1.5px solid #b9c6dc;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 2px 10px rgba(30,60,120,.07);}
  table.sched{border-collapse:separate;border-spacing:0;}
  table.sched thead th{
    background:linear-gradient(#f3f7ff,#e6eefc);color:#2a4a8a;font-size:13.5px;font-weight:700;
    padding:11px 6px;border-bottom:2px solid #8fa3c4;border-right:1px solid #cdd8ec;
  }
  table.sched thead th:last-child{border-right:none;}
  table.sched tbody td{border-bottom:1px solid #dde4f0;border-right:1px solid #e6ebf5;}
  table.sched tbody tr:last-child td{border-bottom:none;}
  table.sched tbody td:last-child{border-right:none;}
  table.sched tbody td.date-cell{background:#f7f9fd;border-right:1.5px solid #b9c6dc;color:#1c2a44;}
  table.sched tbody tr.weekend td.date-cell{background:#fdecec;}
  table.sched tbody tr:nth-child(even):not(.weekend):not(.today) td:not(.date-cell){background:#fbfcfe;}
  table.sched th.grp-start, table.sched td.grp-start{border-left:10px solid #dfe8f6;box-shadow:inset 1px 0 0 #8fa3c4;}
  .col-del{
    display:inline-block;color:var(--off);font-weight:700;font-size:14px;cursor:pointer;
    margin-left:4px;padding:0 3px;border-radius:4px;
  }
  .col-del:hover{background:var(--off-bg);}
  .col-add{
    display:inline-block;cursor:pointer;font-size:14px;font-weight:700;color:var(--brand);
    padding:2px 6px;border-radius:6px;
  }
  .col-add:hover{background:var(--spv-bg);}
  .col-move{
    display:inline-block;cursor:pointer;font-size:11px;color:var(--sub);
    padding:1px 3px;border-radius:4px;flex-shrink:0;
  }
  .col-move:hover{background:var(--line);color:var(--ink);}
  .col-label-input{max-width:90px;}
  table.sched tbody td{
    padding:6px 4px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle;
  }
  table.sched tbody tr:hover{background:#fafbfd;}
  table.sched tbody tr.weekend td.date-cell{color:var(--off);}
  table.sched tbody tr.today, table.sched tbody tr.today td:not(.date-cell){background:#7fdc9c !important;}
  table.sched tbody tr.today td.date-cell{box-shadow:inset 3px 0 0 #0f7a3a; font-weight:800; background:#7fdc9c !important;}
  table.sched tbody tr.auto-off{background:#fdf4f4;}
  td.date-cell{font-weight:700;white-space:nowrap;text-align:left;padding-left:10px !important;}
  td.date-cell .dow{display:block;font-weight:500;color:var(--sub);font-size:10.8px;}
  .auto-off-badge{
    display:inline-block;background:var(--off-bg);color:#a52323;font-weight:600;
    font-size:10.5px;padding:2px 8px;border-radius:20px;margin-left:6px;
  }

  .cell-slot{
    min-height:30px;border-radius:8px;padding:5px 6px;cursor:pointer;
    border:1px solid transparent;font-size:12px;line-height:1.25;
    transition:background .1s;
  }
  .cell-slot:hover{border-color:var(--line);background:#f7f9fc;}
  .cell-slot.empty{color:#c3c9d3;}
  .cell-slot.spv{background:var(--spv-bg);}
  .cell-slot.off{background:var(--off-bg);color:#a52323;font-weight:600;}

  select.edit-select, input.edit-select{
    width:100%;font-size:12px;padding:5px;border-radius:7px;border:1px solid var(--brand);
    font-family:inherit;
  }

  /* Doctors panel */
  .doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
  .doc-item{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#fbfcfe;}
  .doc-item .name{font-weight:700;font-size:13.5px;}

  form.add-doc{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
  form.add-doc input, form.add-doc select{
    padding:8px 10px;border-radius:9px;border:1px solid var(--line);font-family:inherit;font-size:13px;
  }
  form.add-doc input{flex:1;min-width:150px;}
  form.add-doc button{
    background:var(--brand);color:#fff;border:none;padding:9px 16px;border-radius:9px;font-weight:600;cursor:pointer;font-size:13px;
  }
  form.add-doc button:disabled{opacity:.6;cursor:default;}

  /* Payroll */
  .pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:720px){.pay-grid{grid-template-columns:1fr;}}
  .pay-col h3{font-size:14px;margin:0 0 10px;}
  .pay-col h3.spv{color:var(--spv);}
  .field label{display:block;font-size:11.5px;color:var(--sub);margin-bottom:4px;font-weight:600;}
  .field input{width:100%;padding:8px 9px;border-radius:9px;border:1px solid var(--line);font-family:inherit;font-size:13px;}
  table.pay{width:100%;border-collapse:collapse;font-size:12.8px;}
  table.pay th{text-align:left;color:var(--sub);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line);}
  table.pay td{padding:7px 4px;border-bottom:1px solid var(--line);}
  table.pay td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#1c2430;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;
    opacity:0;pointer-events:none;transition:all .25s;z-index:50;box-shadow:var(--shadow);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .loading{
    display:flex;align-items:center;justify-content:center;padding:40px;color:var(--sub);font-size:13px;gap:8px;
  }
  .spinner{
    width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--brand);
    border-radius:50%;animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .empty-state{text-align:center;padding:30px;color:var(--sub);font-size:13px;}

  body.not-owner #doctorDeleteToggle, body.not-owner #doctorEditToggle, body.not-owner #addDocForm, body.not-owner #addPhoneForm, body.not-owner #panel-doctors .col-del{display:none !important;}
  body.not-owner .doc-color-input{pointer-events:none;opacity:.45;}
  @media print{
    @page{ size: landscape; margin: 8mm; }
    *{ -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
    header.top, .tabs, .toast{ display:none !important; }
    .panel{ display:none !important; }
    .panel.active{ display:block !important; }
    .no-print{ display:none !important; }
    #panel-schedule > .card:nth-of-type(2){ display:none !important; } /* phone list not printed */
    .card{ box-shadow:none !important; padding:0 !important; margin:0 !important; border-radius:0 !important; }
    #scheduleWrap > div{ overflow: visible !important; }
    table.sched thead th{ position:static !important; }
    .col-add, .col-move, .col-del{ display:none !important; }
    /* ព្រីនឲ្យចូលតែ ១ ទំព័រ */
    html, body{ height:auto !important; }
    #app{ padding:0 !important; max-width:none !important; }
    .month-nav{ margin:0 0 2px !important; padding:0 !important; }
    .month-nav button, .month-nav .today-btn, .legend{ display:none !important; }
    .month-nav .month-label{ font-size:13px !important; }
    #scheduleWrap > div{ border-radius:0 !important; box-shadow:none !important; border-width:1px !important; }
    table.sched{ width:100% !important; font-size:9.5px !important; page-break-inside:avoid; break-inside:avoid; }
    table.sched thead th{ padding:2px 3px !important; font-size:9.5px !important; }
    table.sched tbody td{ padding:0 2px !important; height:auto !important; line-height:1.15 !important; }
    table.sched tbody td.date-cell{ padding-left:4px !important; white-space:nowrap; }
    td.date-cell .dow{ display:inline !important; margin-left:4px; font-size:8px !important; }
    .cell-slot{ min-height:0 !important; padding:1px 2px !important; font-size:9.5px !important; line-height:1.15 !important; border:none !important; }
    table.sched th.grp-start, table.sched td.grp-start{ border-left-width:5px !important; }
    tr{ page-break-inside:avoid; }
    table.sched tbody tr.today, table.sched tbody tr.today td{ background:transparent !important; box-shadow:none !important; font-weight:inherit !important; }
    table.sched tbody tr.today td.date-cell{ background:#f7f9fd !important; font-weight:700 !important; }
    table.sched tbody tr.weekend.today td.date-cell{ background:#fdecec !important; }
  }
</style>
</head>
<body class="not-owner">
<div id="app">

  <header class="top">
    <div>
      <h1>កាលវិភាគគ្រូពេទ្យ (SOPHEAK VISAL CLINIC)</h1>
      <div class="muted">ឧបករណ៍/អ្នកកែ៖ <span id="deviceNameLabel">—</span> <button type="button" id="openEditBtn" onclick="toggleEditOpen()" style="display:none;border:1px solid #d6dbe6;border-radius:999px;padding:3px 10px;font-family:inherit;font-size:12px;cursor:pointer;">🔴 បិទ</button></div>
    </div>
    <div class="tabs">
      <div class="tab active" data-panel="panel-schedule">កាលវិភាគ</div>
      <div class="tab" data-panel="panel-doctors">គ្រូពេទ្យ</div>
      <div class="tab" data-panel="panel-payroll">ចំនួនថ្ងៃយាម</div>
      <div class="tab" data-panel="panel-log" style="display:none;">កំណត់ត្រាកែប្រែ</div>
      <div class="tab admin-tab" id="ownerBtn" onclick="ownerButtonClick()" role="button">🔒 Admin</div>
    </div>
  </header>

  <!-- SCHEDULE -->
  <div class="panel active" id="panel-schedule">
    <div class="card">
      <div class="month-nav">
        <div class="left">
          <button class="nav-btn" id="prevMonth">‹</button>
          <div class="month-label" id="monthLabel">—</div>
          <button class="nav-btn" id="nextMonth">›</button>
          <button class="today-btn" id="todayBtn">ខែនេះ</button>
          <select class="today-btn" id="monthPicker" style="cursor:pointer;"></select>
          <button type="button" class="today-btn complete-btn" id="unlockScheduleBtn" onclick="toggleScheduleLock()" style="display:none;"></button>
        </div>
        <div class="no-print" style="display:flex;gap:6px;flex-wrap:wrap;">
          <button type="button" class="today-btn" id="printScheduleBtn" onclick="printSchedule()">🖨️ ព្រីនកាលវិភាគ</button>
          <span id="colTools" class="no-print"><button type="button" class="today-btn" onclick="addColumn()" title="បន្ថែមជួរឈរ">+</button> <button type="button" class="today-btn" onclick="toggleHeaderEditMode()" title="កែ/បញ្ចប់កែឈ្មោះជួរឈរ">✎</button></span>
          <button type="button" class="today-btn no-print" onclick="exportBackup()" title="ទាញកាលវិភាគជា Sheet (.xlsx) — បើកក្នុង Google Sheets បាន">⬇ Backup</button>
          <label class="today-btn no-print" style="cursor:pointer;" title="ដាក់ទិន្នន័យពីឯកសារ Sheet (.xlsx) ចូលវិញ">⬆ Restore<input type="file" accept=".xlsx,.json,application/json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="display:none" onchange="importBackup(this)"></label>
        </div>
      </div>
      <div id="scheduleWrap"></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div style="font-weight:700;font-size:15px;">លេខទូរស័ព្ទគ្រូពេទ្យ</div>
        <span class="col-add" id="phoneToggleBtn" onclick="togglePhoneListVisible()">បង្ហាញ</span>
      </div>
      <div id="phoneListWrap" style="display:none;"></div>
    </div>
  </div>

  <!-- DOCTORS -->
  <div class="panel" id="panel-doctors">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
        <div style="font-weight:700;font-size:15px;">បញ្ជីគ្រូពេទ្យ</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <button type="button" id="doctorDeleteToggle" onclick="toggleDoctorDeleteMode()"
            style="border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--off);font-weight:600;">🗑️ លុបគ្រូពេទ្យ</button>
          <button type="button" id="doctorEditToggle" onclick="toggleDoctorEditMode()"
            style="border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--brand);font-weight:600;">✎ កែឈ្មោះទាំងអស់</button>
        </div>
      </div>
      <div class="doc-grid" id="docGrid"></div>
      <form class="add-doc" id="addDocForm">
        <input type="text" id="newName" placeholder="ឈ្មោះ — ឧ. Dr.Sok Dara">
        <button type="submit" id="addDocBtn">+ បន្ថែមគ្រូពេទ្យ</button>
      </form>
    </div>
    <div class="card">
      <div style="font-weight:700;font-size:15px;margin-bottom:10px;">លេខទូរស័ព្ទគ្រូពេទ្យ</div>
      <form class="add-doc" id="addPhoneForm">
        <select id="newPhoneName"></select>
        <input type="text" id="newPhoneNumber" placeholder="លេខទូរស័ព្ទ">
        <button type="submit">+ បន្ថែម</button>
      </form>
    </div>
  </div>

  <!-- PAYROLL -->
  <div class="panel" id="panel-payroll">
    <div class="card">
      <div class="month-nav">
        <div class="left">
          <div class="month-label" id="monthLabelPay">—</div>
          <span style="color:var(--sub);font-size:12px;">(ដូចខែក្នុងកាលវិភាគ)</span>
        </div>
      </div>
      <div id="payWrap"></div>
    </div>
  </div>

  <!-- EDIT LOG -->
  <div class="panel" id="panel-log">
    <div class="card">
      <div class="month-nav">
        <div class="left">
          <div class="month-label" id="monthLabelLog">—</div>
          <span style="color:var(--sub);font-size:12px;">(ដូចខែក្នុងកាលវិភាគ)</span>
        </div>
      </div>
      <div id="reqWrap" class="no-print"></div>
      <div id="logWrap"></div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

// forward: updates the shared template (so any month not yet created will
// include the change) and every already-materialized month strictly AFTER
// fromYm (so existing future months stay in sync too). Months at or before
// fromYm are never touched here — the caller already updated fromYm itself,

function exportBackup() {

      var c = (b.columnsByMonth || {})[ym];

      var line = [r.Date];

function normDateCell(v) {

  if (!isNaN(d.getTime())) return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  return '';
}

  // ចំនួនប្រអប់ត្រូវការ ក្នុងខែនីមួយៗ ក្នុងក្រុមនីមួយៗ

  plan.forEach(function (p) {

// Restore ពី Sheet ដែលមានតែផ្ទាំង Schedule — ជំនួសតែកាលវិភាគ (គ្រូពេទ្យ លេខទូរស័ព្ទ និងជួរឈរដែលមានស្រាប់នៅដដែល)

  }
  if (!newRows.length) throw new Error('រកមិនឃើញជួរកាលវិភាគក្នុងឯកសារទេ');

  // បើមានជួរក្នុង Sheet ដែលខែនោះមិនទាន់មាន → បន្ថែមជួរនោះ ដើម្បីកុំឲ្យទិន្នន័យត្រូវលាក់

  if (!cols) { restoreScheduleOnly(sched); return; }

  var newRows = [];

    if (oldRows[date] && oldRows[date]._log) row._log = oldRows[date]._log; // រក្សាកំណត់ត្រាកែប្រែដែលមានស្រាប់

  });

  Object.keys(byMonth).forEach(function (ym) { cbm[ym] = byMonth[ym].sort(function (a, b) { return a.o - b.o; }).map(function (x) { return x.c; }); });

  STATE.doctors = doctors; STATE.scheduleAll = newRows;
  STATE.columnsByMonth = cbm;

// ⬆ Restore ← ឯកសារ .xlsx ដែលបាន Backup (ឬទាញពី Google Sheets: File → Download → .xlsx) ឬ .json ចាស់
function importBackup(input) {

  rd.onload = function () {

      if (isJson) {
        var d = JSON.parse(rd.result);
        if (!d || !Array.isArray(d.scheduleAll)) throw new Error('ឯកសារមិនត្រឹមត្រូវ');
        if (!window.confirm('ដាក់ទិន្នន័យពី backup ចូលជំនួសទិន្នន័យបច្ចុប្បន្នទាំងអស់? (' + d.scheduleAll.length + ' ថ្ងៃ)')) { input.value = ''; return; }
        STATE.doctors = d.doctors || []; STATE.scheduleAll = d.scheduleAll;
        STATE.columnsByMonth = d.columnsByMonth || {};
        STATE.columnsTemplate = d.columnsTemplate && d.columnsTemplate.length ? d.columnsTemplate : JSON.parse(JSON.stringify(DEFAULT_COLUMNS));
        STATE.doctorPhones = d.doctorPhones || []; STATE.unlockedMonths = d.unlockedMonths || {};
        dataLoaded = true;
        persistRemoteState(); renderSchedule(); renderDoctors();
        showToast('ដាក់ទិន្នន័យចូលវិញរួចរាល់ ✓');
        input.value = '';
      } else {
        var buf = rd.result;
        loadXlsxLib(function () {
          try { restoreFromWorkbook(XLSX.read(buf, { type: 'array' })); }
          catch (e2) { showToast('⚠ ' + e2.message); }

  };

}

var backupTimer = null;
function scheduleBackup() {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_YOUR') === 0) return;
  clearTimeout(backupTimer);
  backupTimer = setTimeout(doBackup, 1500);

function doBackup() {
  try {
    var iframeName = 'backupFrame';
    var iframe = document.getElementById(iframeName);
    if (!iframe) {
      iframe = document.createElement('iframe');
      iframe.name = iframeName;
      iframe.id = iframeName;
      iframe.style.display = 'none';
      document.body.appendChild(iframe);
    }
    var form = document.createElement('form');
    form.method = 'POST';
    form.action = APPS_SCRIPT_URL;
    form.target = iframeName;
    form.style.display = 'none';

    var input = document.createElement('input');
    input.name = 'payload';
    input.value = JSON.stringify({ doctors: STATE.doctors, schedule: STATE.scheduleAll });
    form.appendChild(input);

    document.body.appendChild(form);
    form.submit();
    document.body.removeChild(form);
  } catch (e) { /* backup is best-effort only */ }

function getAvailableMonths() {
  var set = {};
  STATE.scheduleAll.forEach(function (r) {
    var d = String(r.Date || '');
    if (d.length >= 7) set[d.slice(0, 7)] = true;
  });
  var now = new Date();
  set[now.getFullYear() + '-' + pad2(now.getMonth() + 1)] = true;
  return Object.keys(set).sort().reverse();
}

function monthOptionLabel(ym) {
  var parts = ym.split('-');
  return MONTH_NAMES_KM[Number(parts[1]) - 1] + ' ' + parts[0];
}

function refreshMonthPickers() {
  var months = getAvailableMonths();
  var cur = STATE.year + '-' + pad2(STATE.month);
  var picker = document.getElementById('monthPicker');
  picker.innerHTML = months.map(function (ym) {
    return '<option value="' + ym + '"' + (ym === cur ? ' selected' : '') + '>' + monthOptionLabel(ym) + '</option>';
  }).join('');
}

function shiftMonth(delta) {
  var m = STATE.month + delta, y = STATE.year;
  if (m < 1) { m = 12; y--; } else if (m > 12) { m = 1; y++; }
  STATE.year = y; STATE.month = m;
  loadSchedule();
}

function loadSchedule() {
  document.getElementById('monthLabel').textContent = MONTH_NAMES_KM[STATE.month - 1] + ' ' + STATE.year;
  renderSchedule();
  refreshMonthPickers();

  renderPhoneDirectory();

function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
function pad2(n) { return (n < 10 ? '0' : '') + n; }

function rowForDate(dateStr) {
  for (var i = 0; i < STATE.scheduleAll.length; i++) {
    if (STATE.scheduleAll[i].Date === dateStr) return STATE.scheduleAll[i];
  }
  return null;
}

function normName(name) {
  return String(name || '').toLowerCase().replace(/\s+/g, ' ').trim();
}
function findDoctorByNameClient(name) {
  if (!name) return null;
  var n = normName(name);
  return STATE.doctors.filter(function (d) { return normName(d.NameSPV) === n; })[0] || null;

function rowIsAutoOff(rowObj, cols) {
  if (!rowObj) return true;
  cols = cols || getColumnsForMonth(currentScheduleMonthKey());
  return cols.filter(function (c) { return c.type === 'name'; }).every(function (c) { return !rowObj[c.id]; });
}

function columnById(id) {
  var cols = getColumnsForMonth(currentScheduleMonthKey());
  return cols.filter(function (c) { return c.id === id; })[0] || null;
}

var headerEditMode = false;
var dragColId = null;

function renderSchedule() {
  try { renderEditOpenButton(); } catch (e) {}
  var y = STATE.year, m = STATE.month;
  var nDays = daysInMonth(y, m);
  var today = new Date();
  var todayStr = today.getFullYear() + '-' + pad2(today.getMonth() + 1) + '-' + pad2(today.getDate());
  var cols = getColumnsForMonth(currentScheduleMonthKey()).filter(function (c) { return c.type !== 'text'; }); // លាក់ជួរ ផ្សេងៗ (ទិន្នន័យចាស់មិនត្រូវលុបទេ)
  var locked = scheduleMonthLocked();

  document.getElementById('monthLabel').textContent = MONTH_NAMES_KM[m - 1] + ' ' + y;
  renderScheduleLockButton();

  // ចាប់ផ្តើមក្រុមថ្មី (ព្រឹក → យប់ → ផ្សេងៗ) — សម្រាប់បន្ទាត់ខណ្ឌ
  function isGroupStart(i) {
    if (i === 0) return false;
    var p = cols[i - 1], c = cols[i];
    return !(p.type === 'name' && c.type === 'name' && p.label === c.label);
  }
  var headerCells = cols.map(function (c, idx) {
    if (!headerEditMode) {
      if (idx > 0 && !isGroupStart(idx)) return ''; // ត្រូវបានបញ្ចូលក្នុង th ខាងមុខ
      var span = 1;
      if (c.type === 'name') {
        while (idx + span < cols.length && cols[idx + span].type === 'name' && cols[idx + span].label === c.label) span++;
      }
      return '<th class="group-spv' + (idx > 0 ? ' grp-start' : '') + '" colspan="' + span + '" style="padding:2px;">' + escapeHtml(c.label) + '</th>';
    }
    var inner;
    if (headerEditMode) {
      var leftArrow = idx > 0
        ? '<span class="col-move" title="ផ្លាស់ទីទៅឆ្វេង" onclick="moveColumn(\'' + c.id + '\',-1)">◀</span>' : '';
      var rightArrow = idx < cols.length - 1
        ? '<span class="col-move" title="ផ្លាស់ទីទៅស្តាំ" onclick="moveColumn(\'' + c.id + '\',1)">▶</span>' : '';
      inner = '<div style="display:flex;align-items:center;justify-content:center;gap:2px;flex-wrap:nowrap;">' +
        leftArrow +
        '<input type="text" class="edit-select col-label-input" value="' + escapeAttr(c.label) +
        '" data-colid="' + c.id + '" onchange="renameColumn(this)" style="text-align:center;font-weight:600;">' +
        rightArrow +
        '<span class="col-del" title="លុបជួរឈរនេះ" onclick="deleteColumn(\'' + c.id + '\')">×</span>' +
        '</div>';
    } else {
      inner = escapeHtml(c.label);
    }
    return '<th class="group-spv' + (isGroupStart(idx) ? ' grp-start' : '') + '" style="padding:2px;cursor:move;" draggable="true" ' +
      'ondragstart="onColDragStart(event,\'' + c.id + '\')" ondragover="onColDragOver(event)" ondrop="onColDrop(event,\'' + c.id + '\')">' +
      inner + '</th>';
  }).join('');

  var html = '';
  if (locked) {
    html += '<div style="background:var(--off-bg);color:#a52323;border-radius:10px;padding:9px 13px;font-size:12.5px;margin-bottom:12px;font-weight:600;">' +
      '🔒 ខែនេះបានបញ្ចប់ហើយ និងត្រូវបានចាក់សោ — ចុច "🔓 កែប្រែខែនេះ" ខាងលើដើម្បីអនុញ្ញាតឲ្យកែ</div>';
  }
  html += '<div style="overflow-x:auto;"><table class="sched"><thead><tr>' +
    '<th style="text-align:left;">កាលបរិច្ឆេទ</th>' + headerCells +
    '</tr></thead><tbody>';

  for (var d = 1; d <= nDays; d++) {
    var dateStr = y + '-' + pad2(m) + '-' + pad2(d);
    var dow = new Date(y, m - 1, d).getDay();
    var dowName = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][dow];
    var isWeekend = (dow === 0 || dow === 6);
    var row = rowForDate(dateStr) || { Date: dateStr };
    if (!STATE.editing) sortRowAllGroups(row, cols);
    var isAutoOff = rowIsAutoOff(row, cols);

    var trClasses = [];
    if (isWeekend) trClasses.push('weekend');
    if (dateStr === todayStr) trClasses.push('today');
    if (isAutoOff) trClasses.push('auto-off');

    html += '<tr class="' + trClasses.join(' ') + '">';
    html += '<td class="date-cell">' + d + '/' + pad2(m) +
      '<span class="dow">' + DOW_KM[dowName] +
      '</span></td>';

    cols.forEach(function (c, ci) {
      var cell = (c.type === 'text') ? renderOffCell(dateStr, c.id, row[c.id], locked) : renderSlotCell(dateStr, c.id, row[c.id], locked);
      if (isGroupStart(ci)) cell = cell.replace('<td>', '<td class="grp-start">');
      html += cell;
    });
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  document.getElementById('scheduleWrap').innerHTML = html;

  bindCellClicks();
}

function moveColumn(id, delta) {
  if (!requireEdit()) return;
  var cols = getColumnsForMonth(currentScheduleMonthKey());
  var idx = cols.findIndex(function (c) { return c.id === id; });
  var newIdx = idx + delta;
  if (idx === -1 || newIdx < 0 || newIdx >= cols.length) return;
  var moved = cols.splice(idx, 1)[0];
  cols.splice(newIdx, 0, moved);
  enforceMiscLast(cols);
  persistRemoteState();
  renderSchedule();
}
window.moveColumn = moveColumn;

function onColDragStart(e, id) {
  if (!requireEdit()) return;
  dragColId = id;
  e.dataTransfer.effectAllowed = 'move';
}
window.onColDragStart = onColDragStart;

function onColDragOver(e) {
  e.preventDefault();
}
window.onColDragOver = onColDragOver;

function onColDrop(e, targetId) {
  if (!requireEdit()) return;
  e.preventDefault();
  if (!dragColId || dragColId === targetId) { dragColId = null; return; }
  var cols = getColumnsForMonth(currentScheduleMonthKey());
  var fromIdx = cols.findIndex(function (c) { return c.id === dragColId; });
  var toIdx = cols.findIndex(function (c) { return c.id === targetId; });
  dragColId = null;
  if (fromIdx === -1 || toIdx === -1) return;
  var moved = cols.splice(fromIdx, 1)[0];
  cols.splice(toIdx, 0, moved);
  enforceMiscLast(cols);
  persistRemoteState();
  renderSchedule();
  showToast('ប្តូរលំដាប់ជួរឈររួចរាល់ ✓');
}
window.onColDrop = onColDrop;

function toggleHeaderEditMode() {
  if (!requireEdit()) return;
  headerEditMode = !headerEditMode;
  renderSchedule();
}
window.toggleHeaderEditMode = toggleHeaderEditMode;

function renameColumn(inputEl) {
  if (!requireEdit()) return;
  var id = inputEl.dataset.colid;
  var newLabel = inputEl.value.trim();
  var col = columnById(id);
  if (!col) return;
  if (!newLabel) { inputEl.value = col.label; return; }
  col.label = newLabel;
  persistRemoteState();
  showToast('ប្តូរឈ្មោះជួរឈររួចរាល់ ✓');
}
window.renameColumn = renameColumn;

function addColumn() {
  if (!requireEdit()) return;
  var ym = currentScheduleMonthKey();
  var cols = getColumnsForMonth(ym);
  var nameCols = cols.filter(function (c) { return c.type === 'name'; });
  var label = window.prompt('ឈ្មោះជួរឈរថ្មី៖', 'SPV ' + (nameCols.length + 1));
  if (!label) return;
  var id = 'col_' + Date.now();
  var newCol = { id: id, label: label, type: 'name' };
  // Insert before any "misc/other" (type 'text') column — e.g. ផ្សេងៗ —
  // so a newly added shift column always lands in front of it, and
  // ផ្សេងៗ always stays last automatically without needing manual reorder.
  var textIdx = cols.findIndex(function (c) { return c.type === 'text'; });
  if (textIdx === -1) {
    cols.push(newCol);
  } else {
    cols.splice(textIdx, 0, newCol);
  }
  // A column added going forward should also appear in every later month
  // (and any month not yet visited), so schedules stay consistent month to
  // month without having to redo the change each time.
  propagateColumnChangeForward(ym, 'add', newCol);
  persistRemoteState();
  renderSchedule();
  showToast('បន្ថែមជួរឈររួចរាល់ ✓ (និងខែបន្ទាប់ៗទៀត)');
}
window.addColumn = addColumn;

function deleteColumn(id) {
  if (!requireEdit()) return;
  var ym = currentScheduleMonthKey();
  var cols = getColumnsForMonth(ym);
  if (cols.length <= 1) { showToast('ត្រូវមានយ៉ាងហោចណាស់ ១ជួរឈរ'); return; }
  var col = columnById(id);
  if (!col) return;
  if (!window.confirm('លុបជួរឈរ "' + col.label + '"? (ខែនេះ និងខែបន្ទាប់ៗទៀតនឹងលាក់ជួរនេះ — ទិន្នន័យចាស់ៗនឹងមិនត្រូវបានលុបចោលទេ)')) return;
  STATE.columnsByMonth[ym] = cols.filter(function (c) { return c.id !== id; });
  // A deleted column should also disappear from every later month, but
  // earlier months and their saved data are left completely untouched.
  propagateColumnChangeForward(ym, 'delete', id);
  persistRemoteState();
  renderSchedule();
  showToast('លុបជួរឈររួចរាល់ ✓ (និងខែបន្ទាប់ៗទៀត)');
}
window.deleteColumn = deleteColumn;

var MANUAL_DOCTOR_COLORS = {
  S1: { bg: '#5B9BD5', text: '#ffffff' },
  S2: { bg: '#FFFFFF', text: '#333333' }, // Dr.Khean Daline — white/no highlight
  S3: { bg: '#F4B6B6', text: '#7a1f1f' },
  S4: { bg: '#E8B285', text: '#5c3a1e' },
  S5: { bg: '#F5D97A', text: '#6b5900' },
  S6: { bg: '#4C7A3D', text: '#ffffff' },
  LINDA: { bg: '#8DC63F', text: '#1f3d0a' }
};

var NAME_COLOR_PALETTE = [
  '#1747a6', '#0a6b4b', '#a52323', '#8a5300', '#6b3fd1',
  '#0f6b72', '#b23a6b', '#c9852e', '#1c7a3e', '#8a2be2',
  '#c2185b', '#00695c', '#5d4037', '#37474f', '#ad1457'
];
function hashString(str) {
  var hash = 0;
  for (var i = 0; i < str.length; i++) { hash = str.charCodeAt(i) + ((hash << 5) - hash); }
  return Math.abs(hash);
}
function contrastTextFor(hex) {
  hex = String(hex || '').replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(function (c) { return c + c; }).join('');
  if (hex.length !== 6) return '#1c2430';
  var r = parseInt(hex.substr(0, 2), 16), g = parseInt(hex.substr(2, 2), 16), b = parseInt(hex.substr(4, 2), 16);
  var lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return lum > 0.6 ? '#1c2430' : '#ffffff';
}
function getNameColors(name) {
  if (!name) return { bg: null, text: '#1c2430' };
  var doc = STATE.doctors.filter(function (d) { return d.NameSPV === name; })[0];
  if (doc && doc.color) return { bg: doc.color, text: contrastTextFor(doc.color) };
  var key = doc ? doc.ID : name;
  if (MANUAL_DOCTOR_COLORS[key]) return MANUAL_DOCTOR_COLORS[key];
  return { bg: null, text: NAME_COLOR_PALETTE[hashString(key) % NAME_COLOR_PALETTE.length] };
}

function styleFor(name) {
  var c = getNameColors(name);
  var s = 'color:' + c.text + ';';
  if (c.bg) s += 'background:' + c.bg + ';';

}

function performSwap(dateA, fieldA, dateB, fieldB) {
  var ym = dateA.slice(0, 7);
  var cols = getColumnsForMonth(ym).filter(function (c) { return c.type === 'name'; });
  var valA = (rowForDate(dateA) || {})[fieldA], valB = (rowForDate(dateB) || {})[fieldB];
  var colA = columnById(fieldA), colB = columnById(fieldB);
  if (!valA || !valB || !colA || !colB) { showToast('⚠ ក្រឡាមិនមានឈ្មោះទៀតទេ — ដូរមិនបាន'); return false; }
  if (saveCellValue(dateA, fieldA, '') === false) return false;
  if (saveCellValue(dateB, fieldB, '') === false) return false;
  function place(dt, col, v) {
    var r = rowForDate(dt) || {};
    var target = cols.filter(function (c) { return c.label === col.label && !r[c.id]; })[0];
    return saveCellValue(dt, (target || col).id, v);
  }
  if (place(dateA, colA, valB) === false || place(dateB, colB, valA) === false) { showToast('⚠ ដូរមិនបានពេញលេញ — សូមពិនិត្យ'); return false; }
  showToast('ដូរវេនរួចរាល់ ✓');
  return true;
}

    '<select id="swDate" style="' + CM_INP + '">' + dateOpts + '</select>' +

    '<button type="button" id="swGo" style="' + CM_GO + '">' + (asRequest ? 'ផ្ញើទៅ Admin' : 'ដូរ') + '</button>');
  function fillWho() {

// ---- Admin: ទទួលនិងដោះស្រាយសំណើ (បង្ហាញក្នុងផ្ទាំងកំណត់ត្រាកែប្រែ) ----
var REQUESTS = [], requestsUnsub = null;

function dismissRequest(id) {

function applyRequest(id) {

  var ok = true;
  if (r.type === 'delete') {
    var cur = (rowForDate(r.date) || {})[r.field];
    if (cur !== r.value) { showToast('⚠ ក្រឡានេះបានប្រែរួចហើយ — សូមពិនិត្យ'); return; }
    ok = saveCellValue(r.date, r.field, '') !== false;

// ទិសដៅលោតស្វ័យប្រវត្តិ (ពេលចុច Enter ឬពេលជ្រើស/វាយឈ្មោះគ្រូពេទ្យរួច)៖
//   'right' = ជួរឈរបន្ទាប់ក្នុងថ្ងៃដដែល,  'down' = ថ្ងៃបន្ទាប់ក្នុងជួរឈរដដែល
var AUTO_JUMP_DIRECTION = 'right';

// ======== តម្រៀបឈ្មោះគ្រូពេទ្យតាម alphabet ========
// Dr.Ka Seyla នៅចុងក្រោយគេជានិច្ច ក្នុងក្រុមជួរឈរដូចគ្នា ហើយក្រឡាទទេនៅចុងបំផុត
var LAST_DOCTOR_KEY = 'ka seyla';
function sortKeyForName(raw) {
  var base = normName(baseDoctorName(raw));
  return { base: base, last: base.indexOf(LAST_DOCTOR_KEY) !== -1 };
}
function compareDoctorNames(a, b) {
  var ka = sortKeyForName(a), kb = sortKeyForName(b);
  if (ka.last !== kb.last) return ka.last ? 1 : -1;
  if (ka.base < kb.base) return -1;
  if (ka.base > kb.base) return 1;
  return 0;
}
// តម្រៀបតម្លៃក្នុងជួរថ្ងៃតែមួយ ក្នុងក្រុមជួរឈរដែលមានឈ្មោះ (label) ដូចគ្នា
function sortRowGroup(row, ym, field) {
  var cols = getColumnsForMonth(ym);
  var col = cols.filter(function (c) { return c.id === field; })[0];
  if (!col || col.type !== 'name') return;
  var group = cols.filter(function (c) { return c.type === 'name' && c.label === col.label; });
  if (group.length < 2) return;
  var values = group.map(function (c) { return row[c.id] || ''; });
  var filled = values.filter(function (v) { return v; }).sort(compareDoctorNames);
  var empties = values.length - filled.length;
  for (var i = 0; i < empties; i++) filled.push('');
  group.forEach(function (c, i) { row[c.id] = filled[i]; });
}
// តម្រៀបគ្រប់ក្រុមក្នុងជួរថ្ងៃតែមួយ (ប្រើពេលបង្ហាញ — ទិន្នន័យចាស់ក៏តម្រៀបតាម alphabet ដែរ)
function sortRowAllGroups(row, cols) {
  var seen = {};
  cols.forEach(function (c) {
    if (c.type !== 'name' || seen[c.label]) return;
    seen[c.label] = true;
    var group = cols.filter(function (x) { return x.type === 'name' && x.label === c.label; });
    if (group.length < 2) return;
    var values = group.map(function (x) { return row[x.id] || ''; });
    var filled = values.filter(function (v) { return v; }).sort(compareDoctorNames);
    while (filled.length < values.length) filled.push('');
    group.forEach(function (x, i) { if (filled[i] || row[x.id]) row[x.id] = filled[i]; });
  });
}
// ក្រឡាទទេដំបូងក្នុងជួរថ្ងៃ (ក្នុងចំណោមជួរឈរឈ្មោះ) — សម្រាប់លោតបំពេញបន្ត
function firstEmptyNameField(date) {
  var row = rowForDate(date) || {};
  var cols = getColumnsForMonth(currentScheduleMonthKey()).filter(function (c) { return c.type === 'name'; });
  for (var i = 0; i < cols.length; i++) { if (!row[cols[i].id]) return cols[i].id; }
  return null;
}

// រកក្រឡាជិតខាង តាមទិស up / down / left / right
function neighborCell(date, field, dir) {
  var p = date.split('-');
  var y = Number(p[0]), m = Number(p[1]), d = Number(p[2]);
  var dim = daysInMonth(y, m);
  var cols = getColumnsForMonth(currentScheduleMonthKey()).filter(function (c) { return c.type !== 'text'; });
  var idx = cols.findIndex(function (c) { return c.id === field; });
  if (idx < 0 || !cols.length) return null;
  if (dir === 'down' || dir === 'up') {
    d += (dir === 'down') ? 1 : -1;
  } else if (dir === 'right') {
    idx++;
    if (idx >= cols.length) { idx = 0; d++; }   // ចុងជួរ → ថ្ងៃបន្ទាប់ ជួរដំបូង
  } else {
    idx--;
    if (idx < 0) { idx = cols.length - 1; d--; } // ដើមជួរ → ថ្ងៃមុន ជួរចុងក្រោយ
  }
  if (d < 1 || d > dim) return null;
  var nextDate = y + '-' + pad2(m) + '-' + pad2(d);
  return document.querySelector('.cell-slot[data-date="' + nextDate + '"][data-field="' + cols[idx].id + '"]');
}

// ជ្រើសឈ្មោះល្អបំផុតពីអក្សរដែលវាយមិនពេញ (មិនគិត Dr. / ទំហំអក្សរ / ដកឃ្លា)
function bestDoctorMatch(typed, list) {
  function strip(x) { return normName(baseDoctorName(x)).replace(/^dr\.?\s*/, ''); }
  var q = strip(typed).replace(/\s+/g, '');
  if (!q) return null;
  function key(x) { return strip(x).replace(/\s+/g, ''); }
  var sorted = list.slice().sort(compareDoctorNames);
  var i, hit = null;
  for (i = 0; i < sorted.length && !hit; i++) if (key(sorted[i]) === q) hit = sorted[i];
  for (i = 0; i < sorted.length && !hit; i++) if (key(sorted[i]).indexOf(q) === 0) hit = sorted[i];
  for (i = 0; i < sorted.length && !hit; i++) {
    var words = strip(sorted[i]).split(/\s+/);
    if (words.some(function (w) { return w.indexOf(q) === 0; })) hit = sorted[i];
  }
  for (i = 0; i < sorted.length && !hit; i++) if (key(sorted[i]).indexOf(q) !== -1) hit = sorted[i];
  return hit;
}

function openCellInDirection(date, field, dir) {

  if (next) {

// ភ្ជាប់ keyboard ទៅប្រអប់វាយ៖
//   Enter ........ រក្សាទុក + លោតតាម AUTO_JUMP_DIRECTION
//   ↑ ↓ .......... រក្សាទុក + លោតលើ / ក្រោម
//   ← → .......... រក្សាទុក + លោតឆ្វេង / ស្ដាំ (តែពេល cursor នៅដើម / ចុងអក្សរ — បើមិនដូច្នោះ ព្រួញរំកិល cursor ធម្មតា)
//   Tab / Shift+Tab  ស្ដាំ / ឆ្វេង
//   Esc .......... បោះបង់
function wireEditorInput(input, cell, date, field, currentVal, onInputExtra, resolver) {
  var finished = false;
  function finish(cancel, dir) {
    if (finished) return;
    var newVal = input.value.trim();
    if (!cancel && resolver && newVal && newVal !== currentVal) {
      var best = resolver(newVal);
      if (!best) {
        if (dir) { // Enter / ព្រួញ / Tab — មិនអនុញ្ញាតឈ្មោះដែលមិនមានក្នុងបញ្ជីគ្រូពេទ្យ
          showToast('⚠ "' + newVal + '" មិនមានក្នុងបញ្ជីគ្រូពេទ្យ — សូមរើសឈ្មោះដែលមាន');
          input.focus(); input.select();
          return;
        }
        cancel = true; // ចុចចេញក្រៅ ជាមួយឈ្មោះមិនត្រឹមត្រូវ → បោះបង់
      } else newVal = best;
    }
    finished = true;
    STATE.editing = null;
    cell.style.display = '';
    if (cancel) { renderSchedule(); return; }
    var ok = true;
    if (newVal === currentVal) renderSchedule();
    else ok = saveCellValue(date, field, newVal);
    if (dir && ok !== false) openCellInDirection(date, field, dir);
  }
  input.addEventListener('keydown', function (e) {
    if (e.isComposing || e.keyCode === 229) return; // កំពុងវាយអក្សរខ្មែរ (IME)
    var len = input.value.length;
    var selStart = input.selectionStart, selEnd = input.selectionEnd;
    if (e.key === 'Enter') { e.preventDefault(); finish(false, AUTO_JUMP_DIRECTION); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); finish(false, 'down'); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); finish(false, 'up'); }
    else if (e.key === 'ArrowRight' && !e.shiftKey) { e.preventDefault(); finish(false, 'right'); }
    else if (e.key === 'ArrowLeft' && !e.shiftKey) { e.preventDefault(); finish(false, 'left'); }
    else if (e.key === 'Tab') { e.preventDefault(); finish(false, e.shiftKey ? 'left' : 'right'); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(true, null); }
  });
  if (onInputExtra) {
    input.addEventListener('input', function (e) {
      if (e.isComposing) return;
      if (onInputExtra(e)) finish(false, AUTO_JUMP_DIRECTION);
    });
  }
  input.addEventListener('blur', function () {
    setTimeout(function () { finish(false, null); }, 80);
  });
}

function openEditor(cell) {
  if (!canEditMonth(currentScheduleMonthKey())) { if (!isOwner) openLoginModal(); return; }
  if (STATE.editing) return;
  if (scheduleMonthLocked()) {
    showToast('🔒 ខែនេះត្រូវបានចាក់សោ (ខែបានបញ្ចប់ហើយ) — ចុច "🔓 កែប្រែខែនេះ" ដើម្បីកែ');
    return;
  }
  var date = cell.dataset.date;
  var field = cell.dataset.field;
  var currentVal = cell.dataset.value;
  STATE.editing = { date: date, field: field };

  var col = columnById(field);
  if (col && col.type === 'text') {
    var textInput = document.createElement('input');
    textInput.type = 'text';
    textInput.className = 'edit-select';
    textInput.value = currentVal || '';
    textInput.placeholder = 'សរសេរបំពេញ...';

    cell.innerHTML = '';
    cell.style.display = 'flex';
    cell.style.alignItems = 'center';
    cell.appendChild(textInput);
    textInput.focus();
    textInput.select();
    wireEditorInput(textInput, cell, date, field, currentVal, null);
    return;
  }

  // ជួរឈរឈ្មោះ
  var poolFields = getColumnsForMonth(currentScheduleMonthKey()).filter(function (c) { return c.type === 'name'; }).map(function (c) { return c.id; });
  var fromDoctors = STATE.doctors.map(function (d) { return d.NameSPV; }).filter(Boolean);
  var fromHistory = harvestNames(poolFields);
  var suggestions = fromDoctors; // តែឈ្មោះក្នុងបញ្ជីគ្រូពេទ្យប៉ុណ្ណោះ
  var seen = {};
  suggestions = suggestions.filter(function (s) { return s && !seen[s] && (seen[s] = true); });
  suggestions.sort(compareDoctorNames);

  var listId = 'dlist_' + date.replace(/-/g, '') + '_' + field;
  var datalist = document.createElement('datalist');
  datalist.id = listId;
  suggestions.forEach(function (s) {
    var o = document.createElement('option');
    o.value = s;
    datalist.appendChild(o);
  });

  var nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.className = 'edit-select';
  nameInput.setAttribute('list', listId);
  nameInput.value = currentVal || '';
  nameInput.placeholder = 'វាយបញ្ចូលឈ្មោះ...';

  cell.innerHTML = '';
  cell.style.display = 'flex';
  cell.style.alignItems = 'center';
  cell.appendChild(nameInput);
  cell.appendChild(datalist);
  nameInput.focus();
  nameInput.select();

  // លោតស្វ័យប្រវត្តិ៖ ពេលជ្រើសឈ្មោះពីបញ្ជីណែនាំ ឬវាយឈ្មោះគ្រូពេទ្យត្រូវនឹងបញ្ជីពេញលេញ
  wireEditorInput(nameInput, cell, date, field, currentVal, function (e) {
    var v = nameInput.value.trim();
    if (!v) return false;
    var fromList = !e.inputType || e.inputType === 'insertReplacementText';
    var exact = suggestions.indexOf(v) !== -1 &&
      !suggestions.some(function (x) { return x !== v && x.indexOf(v) === 0; });
    // បំពេញអក្សរបន្តស្វ័យប្រវត្តិ (ghost) ពេលវាយនៅដើមឈ្មោះ
    if (e.inputType && e.inputType.indexOf('insertText') === 0 && nameInput.selectionStart === v.length) {
      var low = nameInput.value.toLowerCase();
      var comp = suggestions.filter(function (x) { return x.toLowerCase().indexOf(low) === 0 && x.length > low.length; })[0];
      if (comp) { nameInput.value = comp; nameInput.setSelectionRange(low.length, comp.length); }
    }
    return fromList || exact;
  }, function (typed) {
    return bestDoctorMatch(typed, suggestions);
  });
}

function saveCellValue(date, field, value) {
  if (!canEditMonth(date.slice(0, 7))) { showToast('👁 ខែនេះមិនទាន់បើកឲ្យកែទេ'); renderSchedule(); return false; }
  var row = rowForDate(date);
  if (!row) { row = { Date: date }; STATE.scheduleAll.push(row); }

  if (value) {
    var ym = date.slice(0, 7);
    var cols = getColumnsForMonth(ym);
    var col = cols.filter(function (c) { return c.id === field; })[0];
    if (col && col.type === 'name') {
      var siblings = cols.filter(function (c) { return c.type === 'name' && c.label === col.label && c.id !== field; });
      var dup = siblings.some(function (s) { return row[s.id] === value; });
      if (dup) {
        showToast('⚠ ' + value + ' មានរួចហើយក្នុងក្រុម "' + col.label + '" ថ្ងៃនេះ — មិនអាចដាក់ស្ទួនបានទេ');
        renderSchedule();
        return false;
      }
    }
  }

  var oldValue = row[field] || '';
  row[field] = value;
  sortRowGroup(row, date.slice(0, 7), field);
  var nowIso = new Date().toISOString();

  var logKey = date.slice(0, 7);
  if (!isPastMonthKey(logKey)) {
    row._log = row._log || {};
    row._log[field] = row._log[field] || [];
    row._log[field].push({ at: nowIso, value: value, oldValue: oldValue, device: getDeviceName() });
  }

  purgeFutureLogs();
  renderSchedule();
  showToast('រក្សាទុករួចរាល់ ✓');

  persistRemoteState();
  scheduleBackup();
  return true;
}

      var swatchValue = d.color || c.bg || '#ffffff';

        '<span class="name" style="font-weight:700;font-size:13.5px;' + badgeStyle + '">' + escapeHtml(name) + '</span>' +

      if (!doc) return;
      doc.color = input.value;
      persistRemoteState();
      renderDoctors();
      renderSchedule();
      showToast('ប្តូរពណ៌ឈ្មោះរួចរាល់ ✓');
    });

function deleteDoctor(id) {
  if (!requireOwner()) return;
  var doc = STATE.doctors.filter(function (d) { return d.ID === id; })[0];
  if (!doc) return;
  if (!window.confirm('លុបគ្រូពេទ្យ "' + doc.NameSPV + '" ចេញពីបញ្ជី? (ការកំណត់វេនចាស់ក្នុងកាលវិភាគនឹងមិនត្រូវបានលុបចោលទេ គ្រាន់តែយកគាត់ចេញពីបញ្ជីគ្រូពេទ្យសម្រាប់ជ្រើសរើសនាពេលក្រោយប៉ុណ្ណោះ)')) return;
  STATE.doctors = STATE.doctors.filter(function (d) { return d.ID !== id; });
  persistRemoteState();
  renderDoctors();
  renderSchedule();
  showToast('លុបគ្រូពេទ្យរួចរាល់ ✓');
}

}
window.toggleDoctorDeleteMode = toggleDoctorDeleteMode;

function toggleDoctorEditMode() {
  if (!requireOwner()) return;
  if (doctorEditMode) {
    // Currently in edit mode — this click means "save all".
    var changedCount = 0;
    document.querySelectorAll('.doc-name-input').forEach(function (inp) {
      var id = inp.dataset.id;
      var oldName = inp.dataset.oldname;
      var newName = inp.value.trim();
      if (!newName || newName === oldName) return;
      var doc = STATE.doctors.filter(function (d) { return d.ID === id; })[0];
      if (!doc) return;
      doc.NameSPV = newName;
      changedCount++;
      // Keep past/future schedule entries in sync with the renamed doctor.
      // Each row may belong to a month with its own column set, so resolve
      // per-row rather than assuming the current month's columns apply.
      STATE.scheduleAll.forEach(function (row) {
        var rowYm = String(row.Date || '').slice(0, 7);
        if (!rowYm) return;
        getColumnsForMonth(rowYm).filter(function (c) { return c.type === 'name'; }).forEach(function (c) {
          if (row[c.id] === oldName) row[c.id] = newName;
        });
      });
      // Keep the shared phone directory in sync too.
      STATE.doctorPhones.forEach(function (p) {
        if (p.name === oldName) p.name = newName;
      });
    });
    if (changedCount > 0) {
      persistRemoteState();
      renderSchedule();
      showToast('រក្សាទុកឈ្មោះទាំងអស់រួចរាល់ ✓ (' + changedCount + ')');
      scheduleBackup();
    }
  }
  doctorEditMode = !doctorEditMode;
  renderDoctors();
}
window.toggleDoctorEditMode = toggleDoctorEditMode;

}

    var name = document.getElementById('newPhoneName').value.trim();
    var phone = document.getElementById('newPhoneNumber').value.trim();
    if (!name || !phone) { showToast('សូមជ្រើសរើសគ្រូពេទ្យ និងបញ្ចូលលេខទូរស័ព្ទ'); return; }
    STATE.doctorPhones.push({ id: 'ph_' + Date.now(), name: name, phone: phone });
    persistRemoteState();
    renderPhoneDirectory();
    showToast('បន្ថែមលេខទូរស័ព្ទរួចរាល់ ✓');
    form.reset();
  });
}

// A schedule cell may hold a name plus a trailing time note in parentheses,
// e.g. "Dr.ka seyla (9am-12am)" or "Dr.ka seyla(16pm-19pm)". For payroll
// purposes that's still the same doctor, so strip anything from the first
// "(" onward (and trim) before matching/grouping — the two entries then
// count as one person's shifts, summed together.
function baseDoctorName(name) {
  if (!name) return name;
  var idx = String(name).indexOf('(');
  return (idx === -1 ? name : name.slice(0, idx)).trim();
}

function computePayrollClient(year, month) {
  var prefix = year + '-' + pad2(month);
  var rows = STATE.scheduleAll.filter(function (r) { return String(r.Date).indexOf(prefix) === 0; });
  var spvCounts = {};
  var nameCols = getColumnsForMonth(monthKey(year, month)).filter(function (c) { return c.type === 'name'; });

  rows.forEach(function (r) {
    nameCols.forEach(function (col) {
      var rawName = r[col.id];
      if (!rawName) return;
      var name = baseDoctorName(rawName);
      if (!name) return;
      var doc = findDoctorByNameClient(name);
      var key = doc ? doc.ID : normName(name);
      var displayName = doc ? doc.NameSPV : name;
      if (!spvCounts[key]) spvCounts[key] = { name: displayName, dayShifts: 0, nightShifts: 0, shifts: 0 };
      // Classify purely by whether the column's current header TEXT contains
      // "យប់" (night) or "ព្រឹក" (morning) — never by the column's id/number.
      // So any number of columns sharing that same header word (e.g. two
      // separate "យប់" columns for 2 night doctors) all roll into ONE
      // nightShifts total per doctor — no need to track them separately by
      // "column #2" etc. Renaming a header reclassifies it automatically.
      var isNight = col.label.indexOf('យប់') !== -1;
      var isMorning = col.label.indexOf('ព្រឹក') !== -1;
      if (isNight) spvCounts[key].nightShifts++;
      else if (isMorning) spvCounts[key].dayShifts++;
      else spvCounts[key].dayShifts++; // fallback: anything not explicitly "យប់" counts as day
      spvCounts[key].shifts++;
    });
  });

  var list = Object.keys(spvCounts).map(function (k) { return spvCounts[k]; })
    .sort(function (a, b) { return b.shifts - a.shifts; });

  return { spv: list };
}

function loadPayroll() {
  document.getElementById('monthLabelPay').textContent = MONTH_NAMES_KM[STATE.month - 1] + ' ' + STATE.year;
  var summary = computePayrollClient(STATE.year, STATE.month);
  renderPayroll(summary);
}

// ---- Edit log (កំណត់ត្រាកែប្រែ) ----
function loadLog() {
  document.getElementById('monthLabelLog').textContent = MONTH_NAMES_KM[STATE.month - 1] + ' ' + STATE.year;
  renderLog();
}

function renderLog() {
  if (!isOwner) { document.getElementById('logWrap').innerHTML = '<div class="empty-state">🔒 សម្រាប់ Admin ប៉ុណ្ណោះ</div>'; return; }
  if (purgeFutureLogs() && dataLoaded) persistRemoteState();
  var y = STATE.year, m = STATE.month;
  var key = monthKey(y, m);
  var wrap = document.getElementById('logWrap');

  var prefix = y + '-' + pad2(m);
  var cols = getColumnsForMonth(key);
  var entries = [];
  STATE.scheduleAll.forEach(function (row) {
    if (String(row.Date || '').indexOf(prefix) !== 0) return;
    cols.forEach(function (c) {
      var log = (row._log && row._log[c.id]) || [];
      log.forEach(function (e) {
        entries.push({ date: row.Date, field: c.label, value: e.value, oldValue: e.oldValue, device: e.device, at: e.at });
      });
    });
  });
  entries.sort(function (a, b) { return new Date(b.at) - new Date(a.at); });

  if (!entries.length) {
    wrap.innerHTML = !isPastMonthKey(key)
      ? '<div class="empty-state">កំពុងកត់ត្រា (ខែនេះ) — មិនទាន់មានការកែប្រែទេ</div>'
      : '<div class="empty-state">ខែនេះបានបញ្ចប់ — មិនមានការកែប្រែត្រូវបានកត់ត្រាទុកទេ</div>';
    return;
  }

  var note = isFutureMonthKey(key)
    ? '<div style="color:var(--sub);font-size:12px;font-weight:600;margin-bottom:8px;">ខែនេះមិនទាន់មកដល់ — កំពុងកត់ទុកមុន ហើយនឹងសម្អាតចោលពេលដល់ខែ រួចចាប់ផ្តើមកត់ត្រាថ្មី (រក្សាទុករហូត)</div>'
    : isCurrentMonthKey(key)
    ? '<div style="color:var(--brand);font-size:12px;font-weight:600;margin-bottom:8px;">● កំពុងកត់ត្រា (ខែនេះ) — រក្សាទុករហូត</div>'
    : '<div style="color:var(--sub);font-size:12px;font-weight:600;margin-bottom:8px;">🔒 ខែនេះបានបញ្ចប់ការកត់ត្រា</div>';

  var rows = entries.map(function (e) {
    var d = new Date(e.at);
    var when = pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    var dParts = e.date.split('-');
    var fromCell = e.oldValue ? escapeHtml(e.oldValue) : '<span style="color:var(--sub);">(ទទេ)</span>';
    var toCell = e.value ? escapeHtml(e.value) : '<span style="color:var(--off);">(សម្អាត)</span>';
    var deviceCell = e.device ? escapeHtml(e.device) : '<span style="color:var(--sub);">—</span>';
    return '<tr><td>' + dParts[2] + '/' + dParts[1] + '</td><td>' + escapeHtml(e.field) + '</td><td>' + fromCell +
      '</td><td>→ ' + toCell + '</td><td>' + deviceCell + '</td><td style="color:var(--sub);white-space:nowrap;">' + when + '</td></tr>';
  }).join('');

  wrap.innerHTML = note + '<div style="overflow-x:auto;"><table class="pay"><thead><tr>' +
    '<th>ថ្ងៃ</th><th>វេន</th><th>ពី</th><th>ទៅ</th><th>ឧបករណ៍/អ្នកកែ</th><th style="text-align:right;">ពេលកែប្រែ</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function renderPayroll(summary) {
  if (!summary) { document.getElementById('payWrap').innerHTML = '<div class="empty-state">មិនមានទិន្នន័យទេ</div>'; return; }

  function table(list) {
    if (!list.length) return '<div class="empty-state" style="padding:14px 0;">មិនមានវេនទេ</div>';
    var rows = list.map(function (c) {
      return '<tr><td>' + escapeHtml(c.name) + '</td>' +
        '<td class="num">' + c.dayShifts + '</td><td class="num">' + c.nightShifts + '</td><td class="num">' + c.shifts + '</td></tr>';
    }).join('');
    return '<table class="pay"><thead><tr><th>ឈ្មោះ</th>' +
      '<th style="text-align:right;">ព្រឹក</th><th style="text-align:right;">យប់</th><th style="text-align:right;">សរុប</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>';
  }

  var html = '<div class="pay-grid"><div class="pay-col"><h3 class="spv">SPV</h3>' + table(summary.spv) + '</div></div>';

  document.getElementById('payWrap').innerHTML = html;
}

var toastTimer = null;
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
}

function printSchedule() {
  window.print();
}
window.printSchedule = printSchedule;

function showError(err) {
  console.error(err);
  showToast('កំហុស៖ ' + (err && err.message ? err.message : String(err)));
}
</script>
